<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Admin Control Panel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
            transition: transform 0.1s;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(48, 209, 88, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Admin Mode</span>
            </div>
        </div>

        <div class="title">
            <i class="fa-solid fa-sliders" style="color: var(--accent-orange);"></i> Control Panel
        </div>
        <div class="subtitle">Update system configurations live</div>

        <form onsubmit="saveSettings(event)">
            <div class="input-group">
                <label class="input-label">Change Access Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="newPassword" class="custom-input" placeholder="नया पासवर्ड दर्ज करें..." required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Target Redirect URL</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="url" id="targetUrl" class="custom-input" placeholder="https://example.com" required>
                </div>
            </div>

            <button type="submit" class="btn-save">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>डेटाबेस में सेव करें</span>
            </button>
        </form>
    </div>

    <div class="footer-note">
        FireDk Secure Admin Console • Realtime Sync Enabled
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast">सेटिंग्स सफलतापूर्वक सेव हो गई!</div>

<!-- Firebase Realtime Database SDK (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Load existing settings into inputs automatically
    db.ref('settings').once('value').then((snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.access_key) {
                document.getElementById('newPassword').value = data.access_key;
            }
            if (data.target_url) {
                document.getElementById('targetUrl').value = data.target_url;
            }
        }
    });

    // Save configurations to Firebase Realtime Database
    function saveSettings(e) {
        e.preventDefault();
        const pass = document.getElementById('newPassword').value.trim();
        const url = document.getElementById('targetUrl').value.trim();

        db.ref('settings').set({
            access_key: pass,
            target_url: url
        }).then(() => {
            showToast("सफलतापूर्वक डेटाबेस में अपडेट हो गया!");
        }).catch((error) => {
            alert("सेव करने में त्रुटि: " + error.message);
        });
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }
</script>

</body>
</html>
