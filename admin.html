<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Advanced Admin Panel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .btn-action-main {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 12px;
            padding: 13px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 15px rgba(255, 59, 48, 0.3);
            margin-bottom: 10px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .link-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .link-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        .link-info b {
            color: var(--accent-orange);
            display: block;
            font-size: 12px;
        }

        .link-actions {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: #fff;
        }

        .btn-edit { background: rgba(255, 149, 0, 0.2); color: var(--accent-orange); border: 1px solid rgba(255, 149, 0, 0.3); }
        .btn-del { background: rgba(255, 59, 48, 0.2); color: var(--accent-red); border: 1px solid rgba(255, 59, 48, 0.3); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(48, 209, 88, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Password Card -->
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Security</span>
            </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-key"></i> Password Manager</div>
        <form onsubmit="savePassword(event)">
            <div class="input-group">
                <label class="input-label">Access Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="text" id="adminPassword" class="custom-input" placeholder="Naya password dalein..." required>
                </div>
            </div>
            <button type="submit" class="btn-action-main">
                <i class="fa-solid fa-check"></i>
                <span>Password Update Karein</span>
            </button>
        </form>
    </div>

    <!-- Links Management Card -->
    <div class="card">
        <div class="section-title"><i class="fa-solid fa-link"></i> Telegram / Target Links</div>
        <form onsubmit="saveOrUpdateLink(event)">
            <input type="hidden" id="editingLinkId">
            <div class="input-group">
                <label class="input-label">Link Title (Jaise: Telegram Channel)</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-heading"></i>
                    <input type="text" id="linkTitle" class="custom-input" placeholder="Title dalein..." required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">URL (https://...)</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-globe"></i>
                    <input type="url" id="linkURL" class="custom-input" placeholder="https://t.me/yourchannel" required>
                </div>
            </div>

            <button type="submit" id="submitLinkBtn" class="btn-action-main">
                <i class="fa-solid fa-plus"></i>
                <span>Link Add Karein</span>
            </button>
        </form>

        <div style="margin-top: 15px; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Saved Links List:</div>
        <div id="linksContainer" class="links-list">
            <div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 10px;">Load ho raha hai...</div>
        </div>
    </div>
</div>

<div id="toast" class="toast">Successfully Updated!</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Load Password and Links
    db.ref('settings/access_key').on('value', (snapshot) => {
        if (snapshot.exists()) {
            document.getElementById('adminPassword').value = snapshot.val();
        }
    });

    const linksRef = db.ref('links');
    linksRef.on('value', (snapshot) => {
        const container = document.getElementById('linksContainer');
        container.innerHTML = '';
        
        if (!snapshot.exists()) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 10px;">Koi link nahi hai abhi.</div>';
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();

            const item = document.createElement('div');
            item.className = 'link-item';
            item.innerHTML = `
                <div class="link-info">
                    <b>${data.title}</b>
                    <span style="color: var(--text-muted); font-size: 11px;">${data.url}</span>
                </div>
                <div class="link-actions">
                    <button class="btn-sm btn-edit" onclick="editLink('${key}', '${data.title}', '${data.url}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-sm btn-del" onclick="deleteLink('${key}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            container.appendChild(item);
        });
    });

    // Save Password
    function savePassword(e) {
        e.preventDefault();
        const newPass = document.getElementById('adminPassword').value.trim();
        db.ref('settings/access_key').set(newPass).then(() => {
            showToast("Password successfully update ho gaya!");
        });
    }

    // Add or Update Link
    function saveOrUpdateLink(e) {
        e.preventDefault();
        const editingId = document.getElementById('editingLinkId').value;
        const title = document.getElementById('linkTitle').value.trim();
        const url = document.getElementById('linkURL').value.trim();

        if (editingId) {
            // Update existing
            db.ref('links/' + editingId).set({ title, url }).then(() => {
                showToast("Link successfully edit ho gayi!");
                resetLinkForm();
            });
        } else {
            // Add new
            const newRef = linksRef.push();
            newRef.set({ title, url }).then(() => {
                showToast("Nayi link add ho gayi!");
                resetLinkForm();
            });
        }
    }

    function editLink(key, title, url) {
        document.getElementById('editingLinkId').value = key;
        document.getElementById('linkTitle').value = title;
        document.getElementById('linkURL').value = url;
        document.getElementById('submitLinkBtn').innerHTML = '<i class="fa-solid fa-pen"></i> <span>Link Update Karein</span>';
    }

    function deleteLink(key) {
        if (confirm("Kya aap yeh link delete karna chahte hain?")) {
            db.ref('links/' + key).remove().then(() => {
                showToast("Link delete ho gayi!");
            });
        }
    }

    function resetLinkForm() {
        document.getElementById('editingLinkId').value = '';
        document.getElementById('linkTitle').value = '';
        document.getElementById('linkURL').value = '';
        document.getElementById('submitLinkBtn').innerHTML = '<i class="fa-solid fa-plus"></i> <span>Link Add Karein</span>';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
</script>

</body>
</html>
