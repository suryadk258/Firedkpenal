<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire World Admin Panel</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: linear-gradient(135deg, #fbcfe8 0%, #fed7aa 50%, #e9d5ff 100%); 
            margin: 0; padding: 20px 10px; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; flex-direction: column;
        }

        .admin-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px); 
            padding: 25px 20px; border-radius: 28px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
            width: 100%; max-width: 420px; text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.6); 
        }

        h2 { color: #1e293b; margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        
        .form-group { 
            background: rgba(255, 255, 255, 0.5); 
            padding: 12px; border-radius: 16px; 
            border: 1px solid #e2e8f0; margin-bottom: 14px; 
            text-align: left;
        }

        label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        
        .input-row { display: flex; gap: 8px; }
        
        input { 
            flex: 1; padding: 10px 12px; 
            background: #f1f5f9; border: 1px solid #cbd5e1; 
            border-radius: 10px; font-size: 13px; outline: none; color: #334155; 
        }
        input:focus { border-color: #a855f7; }

        .single-save-btn { 
            background: linear-gradient(135deg, #a855f7, #6366f1); 
            color: white; border: none; padding: 10px 14px; 
            border-radius: 10px; font-size: 12px; font-weight: bold; 
            cursor: pointer; white-space: nowrap; transition: 0.2s; 
        }
        .single-save-btn:active { transform: scale(0.95); }

        .msg { text-align: center; margin-top: 15px; font-size: 13px; color: #16a34a; font-weight: bold; min-height: 20px; }
    </style>
    <!-- Firebase SDK Integration for Live Sync -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div class="admin-card">
        <h2>🛠️ Fire World Admin</h2>

        <div class="form-group">
            <label>🔐 Access Key (पासवर्ड)</label>
            <div class="input-row">
                <input type="text" id="newKey" placeholder="जैसे: SURYA123">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkKey', 'newKey', 'Key सफलतापूर्वक बदल गई!')">Save Key</button>
            </div>
        </div>

        <!-- Target Panel 1 -->
        <div class="form-group">
            <label>📱 Target Panel 1 Link</label>
            <div class="input-row">
                <input type="text" id="newUrl1" placeholder="पैनल 1 का लिंक डालें">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkTargetUrl1', 'newUrl1', 'पैनल 1 लिंक बदल गया!')">Save Panel 1</button>
            </div>
        </div>

        <!-- Target Panel 2 -->
        <div class="form-group">
            <label>📱 Target Panel 2 Link</label>
            <div class="input-row">
                <input type="text" id="newUrl2" placeholder="पैनल 2 का लिंक डालें">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkTargetUrl2', 'newUrl2', 'पैनल 2 लिंक बदल गया!')">Save Panel 2</button>
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">

        <div class="form-group">
            <label>📢 Telegram Channel 1 Link</label>
            <div class="input-row">
                <input type="text" id="ch1" placeholder="https://t.me/... (खाली छोड़कर सेव करने पर हट जाएगा)">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkCh1', 'ch1', 'चैनल 1 अपडेट हो गया!')">Save Ch 1</button>
            </div>
        </div>

        <div class="form-group">
            <label>📢 Telegram Channel 2 Link</label>
            <div class="input-row">
                <input type="text" id="ch2" placeholder="https://t.me/... (खाली छोड़कर सेव करने पर हट जाएगा)">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkCh2', 'ch2', 'चैनल 2 अपडेट हो गया!')">Save Ch 2</button>
            </div>
        </div>

        <div class="form-group">
            <label>📢 Telegram Channel 3 Link</label>
            <div class="input-row">
                <input type="text" id="ch3" placeholder="https://t.me/... (खाली छोड़कर सेव करने पर हट जाएगा)">
                <button class="single-save-btn" onclick="saveToFirebase('fireDkCh3', 'ch3', 'चैनल 3 अपडेट हो गया!')">Save Ch 3</button>
            </div>
        </div>

        <div id="statusMsg" class="msg"></div>
    </div>

    <script>
        // Firebase Setup (सही और एक जैसी डेटाबेस लिंक)
        const firebaseConfig = {
            databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Live Data from Firebase
        window.onload = function() {
            db.ref('settings').on('value', (snapshot) => {
                const data = snapshot.val() || {};
                document.getElementById('newKey').value = data.fireDkKey || "SURYA123";
                document.getElementById('newUrl1').value = data.fireDkTargetUrl1 || "https://worldoff.netlify.app/?s=aHR0cHM6Ly9qYW51LTM4ZTNjLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbXx8fENob290IHBpa2k=";
                document.getElementById('newUrl2').value = data.fireDkTargetUrl2 || "";
                document.getElementById('ch1').value = data.fireDkCh1 || "https://t.me/suryaearningtip";
                document.getElementById('ch2').value = data.fireDkCh2 || "https://t.me/suryaearningtips";
                document.getElementById('ch3').value = data.fireDkCh3 || "https://t.me/Jafarearningtrick";
            });
        }

        // Save Data Directly to Firebase Realtime Database
        function saveToFirebase(keyName, inputId, messageText) {
            let val = document.getElementById(inputId).value.trim();
            
            if (val !== "") {
                db.ref('settings/' + keyName).set(val, (error) => {
                    if (!error) {
                        showNotification("✅ " + messageText);
                    } else {
                        showNotification("❌ त्रुटि: सेव नहीं हो सका!");
                    }
                });
            } else {
                db.ref('settings/' + keyName).remove((error) => {
                    if (!error) {
                        showNotification("🗑️ डेटा हटा दिया गया (Empty कर दिया)!");
                    } else {
                        showNotification("❌ त्रुटि: हटाया नहीं जा सका!");
                    }
                });
            }
        }

        function showNotification(text) {
            let msg = document.getElementById('statusMsg');
            msg.innerText = text;
            setTimeout(() => {
                msg.innerText = "";
            }, 3000);
        }
    </script>
</body>
</html>
