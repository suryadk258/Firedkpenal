<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Easy Admin Panel</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-green);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 12px;
            padding: 13px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 15px rgba(255, 59, 48, 0.3);
            margin-top: 5px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(48, 209, 88, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Live Control</span>
            </div>
        </div>

        <form onsubmit="saveAllSettings(event)">
            <!-- Password Section -->
            <div class="section-title"><i class="fa-solid fa-key"></i> पासवर्ड बदलें</div>
            <div class="input-group">
                <label class="input-label">Access Password</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="text" id="adminPassword" class="custom-input" placeholder="नया पासवर्ड दर्ज करें..." required>
                </div>
            </div>

            <!-- Telegram Links Section -->
            <div class="section-title" style="margin-top: 20px;"><i class="fa-brands fa-telegram"></i> टेलीग्राम लिंक्स (3 ऑप्शन्स)</div>
            
            <div class="input-group">
                <label class="input-label">Telegram Link 1</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-paper-plane"></i>
                    <input type="url" id="tgLink1" class="custom-input" placeholder="https://t.me/channel1">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Telegram Link 2</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-paper-plane"></i>
                    <input type="url" id="tgLink2" class="custom-input" placeholder="https://t.me/channel2">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Telegram Link 3</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-paper-plane"></i>
                    <input type="url" id="tgLink3" class="custom-input" placeholder="https://t.me/channel3">
                </div>
            </div>

            <!-- Main Panel / Target Link Section -->
            <div class="section-title" style="margin-top: 20px;"><i class="fa-solid fa-globe"></i> मुख्य पैनल / टारगेट लिंक</div>
            <div class="input-group">
                <label class="input-label">Main Panel / Target URL</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="url" id="mainTargetUrl" class="custom-input" placeholder="https://example.com" required>
                </div>
            </div>

            <button type="submit" class="btn-save">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>सबकुछ सेव करें</span>
            </button>
        </form>
    </div>
    <div class="footer-note">FireDk Admin Console • Instant Realtime Sync</div>
</div>

<div id="toast" class="toast">सफलतापूर्वक सेव हो गया!</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Load existing settings into inputs automatically
    db.ref('settings').once('value').then((snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.access_key) document.getElementById('adminPassword').value = data.access_key;
            if (data.tg1) document.getElementById('tgLink1').value = data.tg1;
            if (data.tg2) document.getElementById('tgLink2').value = data.tg2;
            if (data.tg3) document.getElementById('tgLink3').value = data.tg3;
            if (data.target_url) document.getElementById('mainTargetUrl').value = data.target_url;
        }
    });

    // Save everything in one click
    function saveAllSettings(e) {
        e.preventDefault();
        const pass = document.getElementById('adminPassword').value.trim();
        const t1 = document.getElementById('tgLink1').value.trim();
        const t2 = document.getElementById('tgLink2').value.trim();
        const t3 = document.getElementById('tgLink3').value.trim();
        const url = document.getElementById('mainTargetUrl').value.trim();

        db.ref('settings').set({
            access_key: pass,
            tg1: t1,
            tg2: t2,
            tg3: t3,
            target_url: url
        }).then(() => {
            showToast("डेटाबेस में सब कुछ अपडेट हो गया!");
        }).catch((error) => {
            alert("त्रुटि: " + error.message);
        });
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
</script>

</body>
</html>
