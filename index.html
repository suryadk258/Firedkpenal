<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireDk</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .card {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%; max-width: 400px; text-align: center;
        }
        .fire-icon { font-size: 40px; margin-bottom: 10px; }
        .app-title { font-size: 22px; font-weight: 700; color: #1e293b; margin: 0 0 5px 0; }
        .live-badge {
            display: inline-block; background: #dcfce7; color: #166534;
            font-size: 11px; padding: 4px 12px; border-radius: 12px;
            margin-bottom: 20px; font-weight: 600;
        }
        .input-wrapper { position: relative; margin-bottom: 15px; }
        .input-wrapper input {
            width: 100%; padding: 12px 45px 12px 15px;
            border: 1px solid #cbd5e1; border-radius: 12px;
            font-size: 14px; box-sizing: border-box; outline: none;
        }
        .eye-btn {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%); background: none;
            border: none; cursor: pointer; font-size: 16px;
        }
        .key-hint { font-size: 11px; color: #64748b; margin-bottom: 20px; text-align: left; padding-left: 4px; }
        .cf-box {
            background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 14px; padding: 12px; margin-bottom: 20px;
        }
        .cf-inner {
            background: #334155; color: white; padding: 12px;
            border-radius: 8px; display: flex; align-items: center;
            gap: 10px; font-size: 14px; font-weight: 500;
        }
        .cf-check {
            background: #22c55e; width: 22px; height: 22px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 12px;
        }
        .cf-brand { font-size: 10px; color: #64748b; text-align: right; margin-top: 6px; }
        .cf-status { font-size: 11px; color: #15803d; text-align: center; margin-top: 8px; font-weight: 600; }
        .unlock-btn {
            background: linear-gradient(135deg, #fb923c, #f43f5e);
            color: white; border: none; width: 100%; padding: 14px;
            border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }
        @keyframes bounceGlow {
            0% { transform: translateY(0); color: #ff0000; }
            50% { transform: translateY(-4px); color: #ff4d4d; text-shadow: 0 0 8px rgba(255,0,0,0.6); }
            100% { transform: translateY(0); color: #ff0000; }
        }
        .animated-key-text {
            display: inline-block; animation: bounceGlow 1.2s infinite ease-in-out;
            font-size: 13px; font-weight: 700; text-decoration: none; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="fire-icon">🔥</div>
        <h2 class="app-title">FireDk</h2>
        <div class="live-badge">🟢 LIVE SYSTEM</div>

        <div class="input-wrapper">
            <input type="password" id="accessKeyInput" placeholder="Enter access key">
            <button class="eye-btn" onclick="togglePasswordView()" id="eyeBtnIcon">👁️</button>
        </div>
        <div class="key-hint">Enter Key must match your registered access key</div>

        <div class="cf-box">
            <div class="cf-inner">
                <div class="cf-check">✓</div>
                <div>Success!</div>
            </div>
            <div class="cf-brand">CLOUDFLARE<br><span style="font-size:8px; opacity:0.7;">Privacy • Help</span></div>
            <div class="cf-status">Verification complete</div>
        </div>

        <button class="unlock-btn" onclick="submitKey()">Unlock Panel →</button>

        <div>
            <a href="https://t.me/kingsearning99" target="_blank" class="animated-key-text">
                🔑 Key ke liye yahan click karein
            </a>
        </div>
    </div>

    <!-- Firebase SDK (Modular & Stable Version) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // Initialize Firebase safely
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let liveSettings = {};

        // Realtime data fetch
        db.ref('settings').on('value', (snapshot) => {
            liveSettings = snapshot.val() || {};
        }, (error) => {
            console.error("Firebase error: ", error);
        });

        function togglePasswordView() {
            let pwdInput = document.getElementById('accessKeyInput');
            let eyeBtn = document.getElementById('eyeBtnIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeBtn.innerText = '🙈';
            } else {
                pwdInput.type = 'password';
                eyeBtn.innerText = '👁️';
            }
        }

        function submitKey() {
            let inputKey = document.getElementById('accessKeyInput').value.trim();
            let correctKey = liveSettings.fireDkKey || 'SURYA123';

            if (!inputKey) {
                alert('Please enter your Access Key!');
                return;
            }

            if (inputKey === correctKey) {
                let targetUrl = liveSettings.fireDkTargetUrl1 || 'https://worldoff.netlify.app/?s=AHOKW9uYWs1LTIzMTI1NjlhMTJmLTlkZWQtcmlzaXZhcy5pbXouY2M=';
                window.location.href = targetUrl;
            } else {
                alert('❌ Wrong Access Key!');
            }
        }
    </script>
</body>
</html>
