<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Management Console</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .shield-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2), rgba(255, 149, 0, 0.2));
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 28px;
            color: var(--accent-red);
            box-shadow: 0 10px 20px rgba(255, 59, 48, 0.15);
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title span {
            color: var(--accent-orange);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-box {
            background: rgba(255, 59, 48, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.5px;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i.fa-key {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 44px 14px 44px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
            transition: transform 0.1s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* Dashboard Panel (Hidden by default) */
        #dashboardPanel {
            display: none;
            text-align: left;
        }

        .target-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .target-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-orange);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .target-url-display {
            font-size: 13px;
            color: #fff;
            word-break: break-all;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            max-height: 80px;
            overflow-y: auto;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-open {
            background: linear-gradient(135deg, #30d158, #28a745);
            color: #fff;
            box-shadow: 0 4px 12px rgba(48, 209, 88, 0.2);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Active</span>
            </div>
        </div>

        <!-- LOGIN FORM SECTION -->
        <div id="loginSection">
            <div class="shield-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="title">W O R <span style="color:var(--accent-orange);">L</span> D</div>
            <div class="subtitle">Device Management Console</div>

            <div id="errorBox" class="error-box">
                <i class="fa-solid fa-circle-exclamation"></i> गलत पासवर्ड! दोबारा कोशिश करें।
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">Access Password</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="accessPassword" class="custom-input" placeholder="पासवर्ड दर्ज करें..." required>
                        <button type="button" class="toggle-password" onclick="togglePassVisibility()">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>लॉगिन करें</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>
        </div>

        <!-- DASHBOARD SECTION (AFTER SUCCESSFUL LOGIN) -->
        <div id="dashboardPanel">
            <div class="shield-icon" style="color: var(--accent-green);">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="title">SUCCESS</div>
            <div class="subtitle">Console Unlocked Successfully</div>

            <div class="target-box">
                <div class="target-label">
                    <i class="fa-solid fa-link"></i> Saved Target Link
                </div>
                <div id="targetUrlText" class="target-url-display">लोड हो रहा है...</div>
                
                <div class="action-buttons">
                    <button type="button" class="btn-action btn-copy" onclick="copyTargetLink()">
                        <i class="fa-solid fa-copy"></i> कॉपी करें
                    </button>
                    <a id="openTargetBtn" href="#" target="_blank" class="btn-action btn-open">
                        <i class="fa-solid fa-external-link-alt"></i> खोलें
                    </a>
                </div>
            </div>

            <button type="button" class="btn-action btn-copy" style="width: 100%; background: rgba(255,59,48,0.2); color: var(--accent-red);" onclick="location.reload()">
                <i class="fa-solid fa-right-from-bracket"></i> लॉग आउट करें
            </button>
        </div>

    </div>

    <div class="footer-note">
        TRUST Admin Console • All connections are logged
    </div>
</div>

<!-- Firebase Realtime Database SDK (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let correctPassword = "admin"; // Default backup password
    let currentLiveTarget = "https://worldoff.netlify.app";

    // Fetch live settings from Firebase instantly
    db.ref('settings').on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.access_key) {
                correctPassword = String(data.access_key).trim();
            }
            if (data.target_url) {
                currentLiveTarget = String(data.target_url).trim();
                document.getElementById('targetUrlText').innerText = currentLiveTarget;
                document.getElementById('openTargetBtn').href = currentLiveTarget;
            }
        }
    });

    // Toggle Password Visibility
    function togglePassVisibility() {
        const passInput = document.getElementById('accessPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            passInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }

    // Handle Login Verification
    function handleLogin(e) {
        e.preventDefault();
        const enteredPass = document.getElementById('accessPassword').value.trim();
        const errorBox = document.getElementById('errorBox');

        // Check against dynamic Firebase password or default backup
        if (enteredPass === correctPassword) {
            errorBox.style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardPanel').style.display = 'block';
        } else {
            errorBox.style.display = 'block';
            document.getElementById('accessPassword').focus();
        }
    }

    // Copy Link Function
    function copyTargetLink() {
        navigator.clipboard.writeText(currentLiveTarget).then(() => {
            alert("लिंक सफलतापूर्वक कॉपी हो गई!");
        }).catch(err => {
            alert("कॉपी करने में विफल: " + err);
        });
    }
</script>

</body>
</html>
