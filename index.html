<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Direct Access</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .shield-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2), rgba(255, 149, 0, 0.2));
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 28px;
            color: var(--accent-red);
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-box {
            background: rgba(255, 59, 48, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i.fa-key {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 44px 14px 44px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Active</span>
            </div>
        </div>

        <!-- LOGIN FORM SECTION -->
        <div id="loginSection">
            <div class="shield-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="title">W O R <span style="color:var(--accent-orange);">L</span> D</div>
            <div class="subtitle">Direct Panel Access</div>

            <div id="errorBox" class="error-box">
                <i class="fa-solid fa-circle-exclamation"></i> गलत पासवर्ड! दोबारा कोशिश करें।
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">Access Password</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="accessPassword" class="custom-input" placeholder="पासवर्ड दर्ज करें..." required>
                        <button type="button" class="eye-btn" onclick="togglePasswordView()">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>पैनल खोलें</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="footer-note">
        TRUST Admin Console • Secure Access
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let correctPassword = "admin"; 
    let targetPanelUrl = 'https://worldoff.netlify.app/?s=aHR0cHM6Ly9qYW51LTM4ZTNjLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbXx8fENob290IHBpa2k=';

    // Firebase से पासवर्ड लोड करना
    db.ref('settings').on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.access_key) {
                correctPassword = String(data.access_key).trim();
            }
            if (data.target_url) {
                targetPanelUrl = data.target_url;
            }
        }
    });

    // आँख वाले आइकन पर क्लिक करने पर पासवर्ड दिखाने/छिपाने का फंक्शन
    function togglePasswordView() {
        const pwdInput = document.getElementById('accessPassword');
        const eyeIcon = document.getElementById('eyeIcon');

        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
        } else {
            pwdInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
        }
    }

    // अगर पहले से लॉगिन है तो सीधे डायरेक्ट लिंक पर भेज दो
    window.onload = function() {
        if (localStorage.getItem('firedk_direct_login') === 'true') {
            window.location.href = targetPanelUrl;
        }
    };

    // लॉगिन हैंडलर
    function handleLogin(e) {
        e.preventDefault();
        const enteredPass = document.getElementById('accessPassword').value.trim();
        const errorBox = document.getElementById('errorBox');

        if (enteredPass === correctPassword) {
            errorBox.style.display = 'none';
            localStorage.setItem('firedk_direct_login', 'true');
            window.location.href = targetPanelUrl;
        } else {
            errorBox.style.display = 'block';
            document.getElementById('accessPassword').focus();
        }
    }
</script>

</body>
</html>
