<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 FireDk - Management Console</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #090b10;
            --bg-card: rgba(18, 22, 32, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3b30;
            --accent-orange: #ff9500;
            --accent-green: #30d158;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.12), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 149, 0, 0.12), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-area span {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-green);
            background: rgba(48, 209, 88, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(48, 209, 88, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .shield-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.2), rgba(255, 149, 0, 0.2));
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 28px;
            color: var(--accent-red);
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title span {
            color: var(--accent-orange);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-box {
            background: rgba(255, 59, 48, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(255, 59, 48, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .input-field-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrapper i.fa-key {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .custom-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .custom-input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 3px rgba(255, 149, 0, 0.2);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.3);
        }

        /* Dashboard Panel */
        #dashboardPanel {
            display: none;
            text-align: left;
        }

        .link-card-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .link-info-text {
            font-size: 13px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-info-text b {
            display: block;
            font-size: 11px;
            color: var(--accent-orange);
            text-transform: uppercase;
        }

        .btn-visit {
            background: linear-gradient(135deg, #30d158, #28a745);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-header">
            <div class="logo-area">
                <i class="fa-solid fa-fire" style="color: #ff3b30;"></i>
                <span>FireDk</span>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>Active</span>
            </div>
        </div>

        <!-- LOGIN FORM SECTION -->
        <div id="loginSection">
            <div class="shield-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="title">W O R <span style="color:var(--accent-orange);">L</span> D</div>
            <div class="subtitle">Device Management Console</div>

            <div id="errorBox" class="error-box">
                <i class="fa-solid fa-circle-exclamation"></i> गलत पासवर्ड! दोबारा कोशिश करें।
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">Access Password</label>
                    <div class="input-field-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="accessPassword" class="custom-input" placeholder="पासवर्ड दर्ज करें..." required>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>लॉगिन करें</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>
        </div>

        <!-- DASHBOARD SECTION (SHOWS ALL LINKS AFTER LOGIN) -->
        <div id="dashboardPanel">
            <div class="shield-icon" style="color: var(--accent-green); background: rgba(48,209,88,0.1); border-color: rgba(48,209,88,0.2);">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="title">SUCCESS</div>
            <div class="subtitle" style="margin-bottom: 16px;">All Links Loaded Successfully</div>

            <div id="allLinksContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; margin-bottom: 16px;">
                <div style="text-align: center; color: var(--text-muted); font-size: 13px;">लोड हो रहा है...</div>
            </div>

            <button type="button" class="btn-login" style="background: rgba(255,59,48,0.2); color: var(--accent-red); border: 1px solid rgba(255,59,48,0.3); padding: 12px;" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> लॉग आउट करें
            </button>
        </div>

    </div>

    <div class="footer-note">
        TRUST Admin Console • Secure Access
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://ne-2db23-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let correctPassword = "admin"; // Default backup password
    let allLinksData = {};

    // Fetch live settings and links from Firebase in real-time
    db.ref('settings').on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.access_key) {
                correctPassword = String(data.access_key).trim();
            }
            
            // Collect links
            allLinksData = {
                tg1: data.tg1 || '',
                tg2: data.tg2 || '',
                tg3: data.tg3 || '',
                target_url: data.target_url || ''
            };
            
            renderLinksList();
        }
    });

    // Check if user was already logged in during this session
    window.onload = function() {
        if (sessionStorage.getItem('firedk_logged_in') === 'true') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardPanel').style.display = 'block';
        }
    };

    // Handle Login Verification
    function handleLogin(e) {
        e.preventDefault();
        const enteredPass = document.getElementById('accessPassword').value.trim();
        const errorBox = document.getElementById('errorBox');

        if (enteredPass === correctPassword) {
            errorBox.style.display = 'none';
            sessionStorage.setItem('firedk_logged_in', 'true'); // Remember login for session
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardPanel').style.display = 'block';
        } else {
            errorBox.style.display = 'block';
            document.getElementById('accessPassword').focus();
        }
    }

    // Render links dynamically inside dashboard
    function renderLinksList() {
        const container = document.getElementById('allLinksContainer');
        container.innerHTML = '';

        const items = [
            { label: 'Telegram Link 1', url: allLinksData.tg1 },
            { label: 'Telegram Link 2', url: allLinksData.tg2 },
            { label: 'Telegram Link 3', url: allLinksData.tg3 },
            { label: 'Main Panel / Target URL', url: allLinksData.target_url }
        ];

        let hasAnyLink = false;
        items.forEach(item => {
            if (item.url) {
                hasAnyLink = true;
                const div = document.createElement('div');
                div.className = 'link-card-box';
                div.innerHTML = `
                    <div class="link-info-text">
                        <b>${item.label}</b>
                        <span>${item.url}</span>
                    </div>
                    <a href="${item.url}" target="_blank" class="btn-visit">खोलें</a>
                `;
                container.appendChild(div);
            }
        });

        if (!hasAnyLink) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 13px;">कोई लिंक उपलब्ध नहीं है।</div>';
        }
    }

    function logout() {
        sessionStorage.removeItem('firedk_logged_in');
        location.reload();
    }
</script>

</body>
</html>
